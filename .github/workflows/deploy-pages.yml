name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx vinext build

      - name: Prerender static HTML
        run: |
          mkdir -p dist/client/Manuel-Donna
          cp -R public/. dist/client/Manuel-Donna/
          (npx vinext start --port 4173 > /tmp/manuel-donna-vinext.log 2>&1 & echo $! > /tmp/manuel-donna-vinext.pid)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/Manuel-Donna/ -o dist/client/Manuel-Donna/index.html; then
              break
            fi
            sleep 2
          done
          test -s dist/client/Manuel-Donna/index.html
          kill $(cat /tmp/manuel-donna-vinext.pid) || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/Manuel-Donna

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
